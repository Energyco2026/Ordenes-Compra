<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard General de Estado · ENERGYCONTROL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F3864; --navy-deep: #14264a; --green: #6F9A35; --green-deep: #587D29;
    --paper: #F7F8F5; --line: #DDE2D8; --ink: #1C2321; --ink-soft: #5B6460;
    --danger: #B3401F; --warning: #C1701F; --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Inter', sans-serif; padding: 32px 16px 64px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .brand img { height: 40px; width: auto; display: block; }
  .brand-sub { font-size: 11px; color: var(--ink-soft); letter-spacing: .03em; border-left: 2px solid var(--line); padding-left: 12px; line-height: 1.4; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 600; color: var(--navy-deep); margin: 20px 0 4px; }
  .lede { font-size: 13.5px; color: var(--ink-soft); margin: 0 0 26px; }

  .section { margin-bottom: 40px; }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .section-title { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 600; color: var(--navy-deep); display: flex; align-items: center; gap: 8px; }
  .section-title .dot { width: 9px; height: 9px; border-radius: 50%; }
  .section-title.cot .dot { background: var(--green); }
  .section-title.oc .dot { background: var(--navy); }
  .count-pill { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 3px 10px; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input[type=text] {
    flex: 1; min-width: 180px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 7px;
    font-family: 'Inter', sans-serif; font-size: 13.5px; background: #fff;
  }
  .toolbar select {
    padding: 9px 10px; border: 1px solid var(--line); border-radius: 7px; background: #fff;
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ink-soft);
  }
  .toolbar input:focus, .toolbar select:focus { outline: none; border-color: var(--navy); }

  table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  thead th {
    text-align: left; font-size: 10.5px; font-weight: 700; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: .04em; padding: 10px 14px; background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  tbody td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid var(--paper); vertical-align: top; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #FAFBF8; }
  .folio { font-family: monospace; font-size: 12px; color: var(--navy-deep); font-weight: 600; }
  .desc { color: var(--ink); max-width: 260px; }
  .muted { color: var(--ink-soft); font-size: 12px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge.stage-1 { background: #E7ECF3; color: var(--navy-deep); }
  .badge.stage-2 { background: #FBEFE4; color: #A85B1F; }
  .badge.stage-3 { background: #EAF1E3; color: var(--green-deep); }
  .badge.stage-4 { background: #E3EAF7; color: var(--navy); }
  .badge.stage-done { background: #EAF1E3; color: var(--green-deep); }
  .badge.stage-rechazada { background: #F7E4DE; color: var(--danger); }

  .urg { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 700; }
  .urg.normal { background: #E7ECF3; color: var(--navy-deep); }
  .urg.urgente { background: #FBEFE4; color: #A85B1F; }
  .urg.critica { background: #F7E4DE; color: var(--danger); }

  .empty { padding: 30px; text-align: center; color: var(--ink-soft); font-size: 13px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); }
  .note { font-size: 11.5px; color: var(--ink-soft); margin-top: 8px; }

  tr.clickable { cursor: pointer; }
  tr.clickable .folio { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
  tr.clickable:hover .folio { text-decoration-color: var(--navy); }

  .detail-row td { background: var(--paper); padding: 0; }
  .detail-inner { padding: 16px 18px 18px; }
  .detail-title { font-size: 11px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
  .timeline { list-style: none; margin: 0; padding: 0; }
  .timeline li { display: flex; gap: 12px; padding-bottom: 16px; position: relative; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li:not(:last-child)::before {
    content: ''; position: absolute; left: 9px; top: 22px; bottom: -2px; width: 2px; background: var(--line);
  }
  .step-dot {
    flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; margin-top: 1px; z-index: 1;
  }
  .step-dot.done { background: var(--green); color: #fff; }
  .step-dot.pending { background: #fff; border: 2px solid var(--warning); color: var(--warning); }
  .step-dot.rejected { background: var(--danger); color: #fff; }
  .step-dot.skipped { background: #fff; border: 2px solid var(--line); color: var(--ink-soft); }
  .step-body .step-name { font-size: 13px; font-weight: 600; color: var(--navy-deep); }
  .step-body .step-meta { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .step-body .step-meta b { color: var(--ink); font-weight: 600; }
  .step-tag { display: inline-block; margin-top: 3px; font-size: 10.5px; font-weight: 700; padding: 1px 8px; border-radius: 20px; }
  .step-tag.done { background: #EAF1E3; color: var(--green-deep); }
  .step-tag.pending { background: #FBEFE4; color: #A85B1F; }
  .step-tag.rejected { background: #F7E4DE; color: var(--danger); }
  .step-tag.skipped { background: #EEF0EC; color: var(--ink-soft); }

  .step-goto {
    display: inline-block; margin-top: 6px; margin-left: 8px; font-size: 11px; font-weight: 700;
    color: var(--navy); text-decoration: none; border-bottom: 1.5px solid var(--navy);
  }
  .step-goto:hover { color: var(--navy-deep); border-color: var(--navy-deep); }

  .warn-entrega { margin-right: 6px; font-size: 12px; }

  .oc-block { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--line); }
  .oc-link-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    color: var(--navy); background: #E3EAF7; padding: 6px 12px; border-radius: 20px;
  }
  .btn-generar-oc {
    padding: 10px 18px; border: none; border-radius: 7px; background: var(--green-deep); color: #fff;
    font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .oc-gen-panel { display: none; margin-top: 14px; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .oc-gen-panel.show { display: block; }
  .oc-gen-panel .oc-field { margin-bottom: 12px; }
  .oc-gen-panel .oc-field:last-of-type { margin-bottom: 0; }
  .oc-gen-panel label { display: block; font-size: 11.5px; font-weight: 600; color: var(--navy-deep); margin-bottom: 5px; }
  .oc-gen-panel input, .oc-gen-panel select {
    width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px;
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--ink); background: var(--paper);
  }
  .oc-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .oc-chip-group { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .oc-chip-opt { position: relative; }
  .oc-chip-opt input { position: absolute; opacity: 0; inset: 0; cursor: pointer; width: 100%; height: 100%; }
  .oc-chip-opt span {
    display: block; text-align: center; padding: 8px 6px; border: 1px solid var(--line); border-radius: 6px;
    font-size: 12.5px; font-weight: 600; color: var(--ink-soft); background: var(--paper);
  }
  .oc-chip-opt input:checked + span { border-color: var(--navy); background: var(--navy); color: #fff; }
  .btn-confirmar-oc {
    width: 100%; margin-top: 4px; padding: 11px; border: none; border-radius: 7px; background: var(--navy);
    color: #fff; font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }

  .tabs { display: flex; gap: 6px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
  .tab-btn {
    display: flex; align-items: center; gap: 8px; padding: 12px 18px; border: none; background: transparent;
    font-family: 'Space Grotesk', sans-serif; font-size: 14.5px; font-weight: 600; color: var(--ink-soft);
    cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; transition: color .15s ease, border-color .15s ease;
  }
  .tab-btn .dot { width: 9px; height: 9px; border-radius: 50%; }
  .tab-btn.oc .dot { background: var(--navy); }
  .tab-btn.cot .dot { background: var(--green); }
  .tab-btn:hover { color: var(--navy-deep); }
  .tab-btn.active { color: var(--navy-deep); border-bottom-color: var(--navy); }
  .tab-btn .count-pill { margin-left: 2px; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  @media (max-width: 700px) {
    table, thead, tbody, tr, th, td { display: block; }
    thead tr { position: absolute; top: -9999px; left: -9999px; }
    tbody tr { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; padding: 4px 0; }
    tbody td { border-bottom: none; padding: 6px 14px; }
    tbody td:before { content: attr(data-label); display: block; font-size: 10px; font-weight: 700; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
  }

  /* ===== Panel de Indicadores (privado) ===== */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .kpi-card .num { font-family: 'Space Grotesk', sans-serif; font-size: 24px; font-weight: 700; color: var(--navy-deep); }
  .kpi-card .lbl { font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 800px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .chart-card .ct { font-size: 13.5px; font-weight: 600; color: var(--navy-deep); font-family: 'Space Grotesk', sans-serif; margin-bottom: 2px; }
  .chart-card .cs { font-size: 11px; color: var(--ink-soft); margin: 0 0 12px; }
  .hbar-list { display: flex; flex-direction: column; gap: 12px; }
  .hbar-item .hbar-top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
  .hbar-item .hbar-name { color: var(--ink); font-weight: 600; }
  .hbar-item .hbar-val { font-weight: 700; color: var(--navy-deep); font-family: 'Space Grotesk', sans-serif; }
  .hbar-track { height: 10px; background: var(--paper); border-radius: 5px; overflow: hidden; }
  .hbar-fill { height: 100%; border-radius: 5px; background: var(--navy); }
  .hbar-fill.warn { background: var(--warning); }
  .hbar-fill.danger { background: var(--danger); }
  .hbar-fill.green { background: var(--green); }
</style>
</head>

<script>
  // ============ DATOS REALES (vienen del flujo de Power Automate) ============
  let DATA_COT = [];
  let DATA_OC = [];

  const URL_FLUJO_DASHBOARD = "https://defaultb2cce9a6443f42c7b085d80d2fb83b.f8.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/04/workflows/a942c6538f94480a91cd1599080f404e/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=aWNKSYUYC7kFCx6Gd9kjoiEnaf-X25UciKQ3UGAZwhw";

  // Traduce las etapas que calcula el flujo a las que espera el dashboard
  function mapEtapaCot(etapa) {
    const m = {
      "Por cotizar": "Por cotizar",
      "Por seleccionar proveedor": "Por seleccionar",
      "Por aprobar": "Por seleccionar",
      "Aprobada, pendiente generar OC": "Cotización cerrada",
      "Convertida a Orden de Compra": "Cotización cerrada"
    };
    return m[etapa] || etapa || "Por cotizar";
  }
  function mapEtapaOc(etapa) {
    const m = {
      "Por aprobar": "Por aprobar",
      "Por enviar a proveedor": "Por enviar a proveedor",
      "Pendiente de entrega": "Enviada a proveedor",
      "Mercadería Entregada": "Mercadería Entregada"
    };
    return m[etapa] || etapa || "Por aprobar";
  }

  async function cargarDatosReales() {
    try {
      const resp = await fetch(URL_FLUJO_DASHBOARD, { method: "POST" });
      if (!resp.ok) throw new Error("Respuesta no válida: " + resp.status);
      const data = await resp.json();

      DATA_COT = (data.cotizaciones || []).map(d => ({
        convId: d.ConvID,
        solicitante: d.Administrador || "—",
        departamento: d.Departamento || "—",
        descripcion: d.Descripcion || "—",
        urgencia: d.Urgencia || "Normal",
        tipo: d.Tipo || "Local",
        fecha: d.Fecha || "—",
        etapa: mapEtapaCot(d.EtapaActual),
        fechaSolicitud: d.Fecha || null,
        fechaCotizado: null,
        fechaSeleccion: null,
        numeroPO: d.NumeroPO,
        ocConvId: (d.OCGeneradas && d.OCGeneradas.trim()) ? d.OCGeneradas.trim() : null
      }));

      DATA_OC = (data.ordenesCompra || []).map(d => ({
        convId: d.ConvID,
        numeroPO: d.PO || "No aplica",
        solicitante: d.Solicitante || "—",
        departamento: d.Departamento || "—",
        descripcion: d.Descripcion || "—",
        categoria: d.Categoria || "Normal",
        fecha: d.FechaSolicitud || "—",
        etapa: mapEtapaOc(d.EtapaActual),
        proveedor: d.Proveedor || null,
        aprobador: d.Aprobador || "—",
        fechaSolicitud: d.FechaSolicitud || null,
        fechaOrden: d.FechaOrden || null,
        fechaAprobacion: d.FechaAprobacion || null,
        fechaEnvio: d.FechaEnvio || null,
        fechaEsperadaMaterial: excelSerialADate(d.FechaEntregaEsperada),
        fechaRecibido: excelSerialADate(d.FechaRecepcionReal)
      }));
    } catch (e) {
      console.error("No se pudo cargar el flujo de Power Automate:", e);
      document.getElementById('tablaCotWrap').innerHTML = '<div class="empty">No se pudieron cargar los datos. Revisa la conexión con Power Automate.</div>';
      document.getElementById('tablaOcWrap').innerHTML = '<div class="empty">No se pudieron cargar los datos. Revisa la conexión con Power Automate.</div>';
    }
  }

  function stageClassCot(etapa) {
    if (etapa === "Por cotizar") return "stage-1";
    if (etapa === "Por seleccionar") return "stage-2";
    return "stage-done";
  }
  function stageClassOc(etapa) {
    if (etapa === "Por generar orden") return "stage-1";
    if (etapa === "Por aprobar") return "stage-2";
    if (etapa === "Por enviar a proveedor") return "stage-4";
    if (etapa === "Enviada a proveedor") return "stage-4";
    if (etapa === "Mercadería Entregada") return "stage-done";
    if (etapa === "Rechazada") return "stage-rechazada";
    return "stage-1";
  }

  // Convierte un número de serie de fecha de Excel (ej. 46234) a "d/m/yyyy".
  // Si el valor ya viene como texto de fecha, lo deja igual.
  function excelSerialADate(valor) {
    if (valor === null || valor === undefined || valor === '') return null;
    if (typeof valor === 'number' || /^\d+(\.\d+)?$/.test(String(valor).trim())) {
      const serial = parseFloat(valor);
      const ms = Math.round((serial - 25569) * 86400 * 1000); // 25569 = días entre 1899-12-30 y 1970-01-01
      const fecha = new Date(ms);
      const d = String(fecha.getUTCDate()).padStart(2, '0');
      const m = String(fecha.getUTCMonth() + 1).padStart(2, '0');
      const y = fecha.getUTCFullYear();
      return `${d}/${m}/${y}`;
    }
    return valor;
  }

  function diasParaEntrega(fechaStr) {
    if (!fechaStr) return null;
    const [d, m, y] = fechaStr.split('/').map(Number);
    const entrega = new Date(y, m - 1, d);
    const hoy = new Date(); hoy.setHours(0,0,0,0);
    return Math.round((entrega - hoy) / (1000 * 60 * 60 * 24));
  }

  function avisoEntrega(d) {
    if (d.fechaRecibido || d.etapa === "Rechazada" || d.etapa === "Mercadería Entregada") return '';

    if (dias === null) return '';
    if (dias <= 1) return `<span class="warn-entrega" title="Entrega ${dias < 0 ? 'vencida' : dias === 0 ? 'es hoy' : 'es mañana'}">🔴</span>`;
    return '';

  // ⚠️ Cambia esta clave antes de subir el archivo
  const CLAVE_ACCESO_KPI = "gerencia2026";

  document.getElementById('kpiBtnEntrar').addEventListener('click', intentarEntrarKpi);
  document.getElementById('kpiClaveInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') intentarEntrarKpi(); });

  function parseFechaKpi(str) {
    if (!str) return null;
    const partes = String(str).split('/').map(Number);
    if (partes.length !== 3 || partes.some(isNaN)) return null;
    const [d, m, y] = partes;
    return new Date(y, m - 1, d);
  }
  function diffDiasKpi(inicioStr, finStr) {
    const a = parseFechaKpi(inicioStr), b = parseFechaKpi(finStr);
    if (!a || !b) return null;
    return Math.round((b - a) / (1000 * 60 * 60 * 24));
  }
  function promedioKpi(arr) {
    const nums = arr.filter(n => n !== null && !isNaN(n) && n >= 0);
    if (!nums.length) return null;
    return Math.round((nums.reduce((a, b) => a + b, 0) / nums.length) * 10) / 10;
  }
  function colorPorUmbral(valor, umbralWarn, umbralDanger, invertido) {
    if (invertido) {
      if (valor <= umbralDanger) return 'danger';
      if (valor <= umbralWarn) return 'warn';
      return 'green';
    }
    if (valor >= umbralDanger) return 'danger';
    if (valor >= umbralWarn) return 'warn';
    return '';
  }
  function hbarListHtml(items, maxVal, sufijo) {
    return `<div class="hbar-list">` + items.map(it => `
      <div class="hbar-item">
        <div class="hbar-top"><span class="hbar-name">${it.nombre}</span><span class="hbar-val">${it.valor}${sufijo || ''}</span></div>
        <div class="hbar-track"><div class="hbar-fill ${it.clase}" style="width:${maxVal > 0 ? Math.min(100, (it.valor / maxVal) * 100) : 0}%"></div></div>
      </div>`).join('') + `</div>`;
  }

  function renderKpis() {
    const oc = DATA_OC; // reutiliza los mismos datos ya cargados del dashboard

    const diasGenerarOrden = oc.map(d => diffDiasKpi(d.fechaSolicitud, d.fechaOrden));
    const diasAprobar = oc.map(d => diffDiasKpi(d.fechaOrden, d.fechaAprobacion));
    const diasEnviar = oc.map(d => diffDiasKpi(d.fechaAprobacion, d.fechaEnvio));
    const diasCiclo = oc.map(d => diffDiasKpi(d.fechaSolicitud, d.fechaRecibido));

    document.getElementById('kpiResumen').innerHTML = `
      <div class="kpi-card"><div class="num">${promedioKpi(diasGenerarOrden) ?? '—'}</div><div class="lbl">Días en generar la orden</div></div>
      <div class="kpi-card"><div class="num">${promedioKpi(diasAprobar) ?? '—'}</div><div class="lbl">Días en aprobar</div></div>
      <div class="kpi-card"><div class="num">${promedioKpi(diasEnviar) ?? '—'}</div><div class="lbl">Días en enviar a proveedor</div></div>
      <div class="kpi-card"><div class="num">${promedioKpi(diasCiclo) ?? '—'}</div><div class="lbl">Días del ciclo completo</div></div>
      <div class="kpi-card"><div class="num">${oc.length}</div><div class="lbl">Órdenes analizadas</div></div>
    `;

    // Urgencia por administrador
    const porAdmin = {};
    oc.forEach(d => {
      if (!porAdmin[d.solicitante]) porAdmin[d.solicitante] = { total: 0, urgentes: 0 };
      porAdmin[d.solicitante].total++;
      if (d.categoria === 'Urgente' || d.categoria === 'Crítica') porAdmin[d.solicitante].urgentes++;
    });
    const itemsUrgencia = Object.entries(porAdmin)
      .map(([nombre, v]) => ({ nombre, valor: Math.round((v.urgentes / v.total) * 100), clase: colorPorUmbral(Math.round((v.urgentes / v.total) * 100), 25, 50) }))
      .sort((a, b) => b.valor - a.valor);

    // Tiempo de aprobación por aprobador
    const porAprobador = {};
    oc.forEach(d => {
      const dias = diffDiasKpi(d.fechaOrden, d.fechaAprobacion);
      if (dias === null) return;
      if (!porAprobador[d.aprobador]) porAprobador[d.aprobador] = [];
      porAprobador[d.aprobador].push(dias);
    });
    const itemsAprobadores = Object.entries(porAprobador)
      .map(([nombre, arr]) => ({ nombre, valor: promedioKpi(arr), clase: colorPorUmbral(promedioKpi(arr), 1.5, 3) }))
      .filter(it => it.valor !== null)
      .sort((a, b) => b.valor - a.valor);
    const maxAprob = Math.max(1, ...itemsAprobadores.map(it => it.valor));

    // Cumplimiento de proveedores
    const porProveedor = {};
    oc.forEach(d => {
      if (!d.fechaEsperadaMaterial || !d.fechaRecibido) return;
      if (!porProveedor[d.proveedor]) porProveedor[d.proveedor] = { total: 0, aTiempo: 0 };
      porProveedor[d.proveedor].total++;
      const esperada = parseFechaKpi(d.fechaEsperadaMaterial);
      const recibida = parseFechaKpi(d.fechaRecibido);
      if (esperada && recibida && recibida <= esperada) porProveedor[d.proveedor].aTiempo++;
    });
    const itemsProveedores = Object.entries(porProveedor)
      .map(([nombre, v]) => ({ nombre, valor: Math.round((v.aTiempo / v.total) * 100), clase: colorPorUmbral(Math.round((v.aTiempo / v.total) * 100), 50, 80, true) }))
      .sort((a, b) => b.valor - a.valor);

    let chartsHtml = '';
    chartsHtml += `<div class="chart-card"><div class="ct">Urgencia por administrador</div><div class="cs">% de solicitudes Urgente/Crítica sobre su total</div>` +
      (itemsUrgencia.length ? hbarListHtml(itemsUrgencia, 100, '%') : '<div class="empty">Sin datos.</div>') + `</div>`;
    chartsHtml += `<div class="chart-card"><div class="ct">Tiempo de aprobación por aprobador</div><div class="cs">Promedio de días entre orden generada y aprobada</div>` +
      (itemsAprobadores.length ? hbarListHtml(itemsAprobadores, maxAprob, ' d') : '<div class="empty">Sin datos.</div>') + `</div>`;
    chartsHtml += `<div class="chart-card"><div class="ct">Cumplimiento de proveedores</div><div class="cs">% de entregas a tiempo</div>` +
      (itemsProveedores.length ? hbarListHtml(itemsProveedores, 100, '%') : '<div class="empty">Sin entregas confirmadas todavía.</div>') + `</div>`;
    chartsHtml += `<div class="chart-card"><div class="ct">Desglose del ciclo (promedio en días)</div><div class="cs">Dónde se va el tiempo, de solicitud a recepción</div>` +
      hbarListHtml([
        { nombre: 'Generar orden', valor: promedioKpi(diasGenerarOrden) ?? 0, clase: '' },
        { nombre: 'Aprobar', valor: promedioKpi(diasAprobar) ?? 0, clase: '' },
        { nombre: 'Enviar a proveedor', valor: promedioKpi(diasEnviar) ?? 0, clase: '' }
      ], Math.max(1, promedioKpi(diasGenerarOrden) || 0, promedioKpi(diasAprobar) || 0, promedioKpi(diasEnviar) || 0), ' d') + `</div>`;

    document.getElementById('kpiCharts').innerHTML = chartsHtml;
  }
</script>
</body>
</html>
